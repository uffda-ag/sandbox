<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CropSight US — UFFDA Sandbox</title>

    <link
      rel="stylesheet"
      href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <!--
    Sprint 19 fix-cycle: stripped duplicative chrome (title, tagline,
    caveat-panel, attribution, tile-meta script tag). Outer Next.js
    /sandbox/<slug>/ route already renders title/tagline/attribution
    from the tile registry, and the iframe runs under sandbox="allow-
    scripts allow-popups" (no allow-same-origin) which made the runtime
    tile.json fetch fail with an opaque-origin CORS reject — blanking
    every map. Map mounts directly with hard-coded constants now.
  -->
  <body data-paint-mode="fill-outline">
    <div id="map" class="map"></div>

    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <script src="https://unpkg.com/pmtiles@4.4.1/dist/pmtiles.js"></script>
    <script type="module" src="app.js"></script>
  </body>
</html>
