<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ACPF Corn Belt fields — UFFDA Sandbox</title>

    <link
      rel="stylesheet"
      href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <!--
    Sprint 19 fix-cycle: stripped duplicative chrome (title, tagline,
    caveat-panel, attribution, tile-meta script tag). Outer Next.js
    /sandbox/<slug>/ route already renders title/tagline/attribution
    from the tile registry. State-filter pill row stays — it's a real
    UI control, not chrome.
  -->
  <body data-paint-mode="fill-outline">
    <header class="hud">
      <!-- State filter pill row. JS reads `data-state` and pushes a
           `setFilter` against the fields layer. `data-state=""` means
           "all states". -->
      <div class="state-filter" id="state-filter" role="group" aria-label="State filter">
        <button type="button" class="state-pill is-active" data-state="">All</button>
        <button type="button" class="state-pill" data-state="IA">IA</button>
        <button type="button" class="state-pill" data-state="MN">MN</button>
        <button type="button" class="state-pill" data-state="WI">WI</button>
        <button type="button" class="state-pill" data-state="IL">IL</button>
      </div>
    </header>

    <main class="map-shell">
      <div id="map" class="map"></div>
    </main>

    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <script src="https://unpkg.com/pmtiles@4.4.1/dist/pmtiles.js"></script>
    <script type="module" src="app.js"></script>
  </body>
</html>
